<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Vigilant ESP media search as the first ESP reference implementation</title>
<desc id="desc">Natural-language experiential intent is mapped to typed semantic and vector state, matched against film experience DNA, and returned as explainable ranked results.</desc>
<rect width="1200" height="470" rx="28" fill="#0d1117"/>
<text x="60" y="70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#f0f6fc">First ESP reference implementation: Experience Retrieval</text>
<text x="60" y="106" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#8b949e">Media discovery: represent experience preferences, then retrieve content by that state.</text>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <rect x="60" y="160" width="250" height="180" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
 <text x="185" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f6fc">Human intent</text>
 <text x="88" y="244" font-size="15" fill="#c9d1d9">“dark revenge,</text>
 <text x="88" y="269" font-size="15" fill="#c9d1d9">but not hopeless”</text>
 <text x="88" y="306" font-size="15" fill="#8b949e">language is only the input UI</text>

 <path d="M330 250 H410" stroke="#58a6ff" stroke-width="4"/><path d="M397 238 L412 250 L397 262" fill="none" stroke="#58a6ff" stroke-width="4"/>

 <rect x="430" y="160" width="300" height="180" rx="22" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
 <text x="580" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#3fb950">Typed semantic + vector state</text>
 <text x="468" y="241" font-size="15" fill="#c9d1d9">INT · EMO · CTX</text>
 <text x="468" y="269" font-size="15" fill="#c9d1d9">themes · subjects · pacing</text>
 <text x="468" y="297" font-size="15" fill="#c9d1d9">dense synopsis semantics</text>
 <text x="468" y="324" font-size="15" fill="#8b949e">explicit weights, filters, avoid-state</text>

 <path d="M750 250 H830" stroke="#58a6ff" stroke-width="4"/><path d="M817 238 L832 250 L817 262" fill="none" stroke="#58a6ff" stroke-width="4"/>

 <rect x="850" y="160" width="290" height="180" rx="22" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
 <text x="995" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#a371f7">Experience match</text>
 <text x="885" y="241" font-size="15" fill="#c9d1d9">hybrid retrieval + RRF</text>
 <text x="885" y="269" font-size="15" fill="#c9d1d9">tone-shift “like X, but Y”</text>
 <text x="885" y="297" font-size="15" fill="#c9d1d9">ranked results + reasons</text>
 <text x="885" y="324" font-size="15" fill="#8b949e">experience-aware, not keyword-only</text>
</g>
<text x="600" y="405" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#8b949e">Today: media discovery. Future ESP research: richer modalities, agents, learning systems and consent-bound neural interfaces.</text>
</svg>
