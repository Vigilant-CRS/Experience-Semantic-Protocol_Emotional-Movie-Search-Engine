  <title id="title">Vigilant ESP — Find a feeling. Discover a film.</title>
  <desc id="desc">Vigilant e.K.'s emotional movie search engine: human intent becomes typed preferences and ranked discovery. First media-search implementation in the Experience Semantic Protocol research program. Paper DOI 10.5281/zenodo.20024213.</desc>
